<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Invoice INV-001</title>
    <style>
      @page {
        size: A4;
        margin: 24mm;
      }

      * {
        box-sizing: border-box;
      }

      body {
        color: #191919;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
      }

      .document-header {
        border-bottom: 1px solid #d9d9d9;
        margin-bottom: 24px;
        padding-bottom: 18px;
      }

      .eyebrow {
        color: #666;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.08em;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      h1 {
        font-size: 28px;
        line-height: 1.1;
        margin: 0;
      }

      h2 {
        border-bottom: 1px solid #e6e6e6;
        font-size: 14px;
        margin: 0 0 14px;
        padding-bottom: 6px;
        text-transform: uppercase;
      }

      h3 {
        font-size: 14px;
        margin: 0;
      }

      .summary {
        color: #333;
        font-size: 13px;
        margin: 12px 0 0;
        max-width: 640px;
      }

      .details {
        display: grid;
        gap: 8px 24px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        margin: 18px 0 0;
      }

      .details div {
        min-width: 0;
      }

      .details dt {
        color: #666;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
      }

      .details dd {
        margin: 2px 0 0;
      }

      table {
        border-collapse: collapse;
        width: 100%;
      }

      th,
      td {
        border-bottom: 1px solid #e6e6e6;
        padding: 10px 0;
        text-align: left;
        vertical-align: top;
      }

      tfoot th {
        border-bottom: 0;
        font-size: 14px;
        padding-top: 14px;
      }

      .amount {
        text-align: right;
        white-space: nowrap;
      }

      .experience {
        margin-bottom: 18px;
      }

      .company {
        color: #555;
        margin: 2px 0 8px;
      }

      ul {
        margin: 0;
        padding-left: 18px;
      }
    </style>
  </head>
  <body>
    
        <header class="document-header">
          <p class="eyebrow">Invoice</p>
          <h1>Invoice INV-001</h1>
          <dl class="details">
                      <div>
                        <dt>Bill To</dt>
                        <dd>Acme Inc.</dd>
                      </div>
                    
                      <div>
                        <dt>Tax ID</dt>
                        <dd>TX-123</dd>
                      </div>
                    </dl>
        </header>
        <table>
          <thead>
            <tr>
              <th>Description</th>
              <th class="amount">Amount</th>
            </tr>
          </thead>
          <tbody>
            
                  <tr>
                    <td>Discovery work</td>
                    <td class="amount">$1,200.00</td>
                  </tr>
                
                  <tr>
                    <td>Implementation</td>
                    <td class="amount">$3,400.50</td>
                  </tr>
                
          </tbody>
          <tfoot>
            <tr>
              <th>Total</th>
              <th class="amount">$4,600.50</th>
            </tr>
          </tfoot>
        </table>
      
  </body>
</html>
